version: '3.8'

services:
  # 1. 메인 데이터베이스 (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: monewment_db
    restart: always
    environment:
      # .env 파일의 값을 가져와서 DB를 생성합니다.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. DB 관리 도구 (웹 브라우저 접속용)
  adminer:
    image: adminer
    container_name: monewment_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data:
