version: '3.8'

services:
  # 1. Main Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: monewment-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: monewment1234
      POSTGRES_DB: monewment
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: monewment-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:monewment1234@db:5432/monewment
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      # Mount source for hot reload (if we add --reload to command in Dockerfile later)

      # 3. Frontend GUI (Next.js)
  frontend:
    build:
      context: ./gui
      dockerfile: Dockerfile
    container_name: monewment-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./gui:/app
      - /app/node_modules

volumes:
  postgres_data:
