# areum.yaml — AREUM 인스턴스 설정 파일
# 복제 후 반드시 소속 STRATUM과 QUEEN 정보를 채워주세요.

# ─── 인스턴스 신분 ──────────────────────────────────────────────────────────────
areum_name: "AREUM-66CA"

# ─── 소속 정보 (탄생 성사에 필요) ──────────────────────────────────────────────
stratum_id: "3bb565af-e01a-49b8-af27-049e6a642f2d"
queen_id: "ba537759-f607-4eda-841c-eeba65a5147b"

# ─── 제국 코어망 접속 정보 ──────────────────────────────────────────────────────
core:
  host: "127.0.0.1"
  port: 8800

# ─── 로컬 Ollama 설정 (폐쇄망 AI) ─────────────────────────────────────────────
ollama:
  host: "127.0.0.1"
  port: 8800
  model: "gemma3:4b"
  timeout_sec: 90             # 로컬 LLM 특성상 넉넉하게 설정

# ─── 파이프라인 설정 ────────────────────────────────────────────────────────────
pipeline:
  poll_interval_sec: 30       # 미처리 자산 폴링 주기 (초)
  batch_size: 5               # 1회 최대 처리 자산 수
  max_retries: 3              # Ollama 실패 시 최대 재시도 횟수
