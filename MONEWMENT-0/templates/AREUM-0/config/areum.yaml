# areum.yaml — AREUM 인스턴스 설정 파일
# 복제 후 반드시 소속 STRATUM과 QUEEN 정보를 채워주세요.

# ─── 인스턴스 신분 ──────────────────────────────────────────────────────────────
areum_name: "AREUM-1"         # 이 인스턴스의 이름 (STRATUM당 고유)

# ─── 소속 정보 (탄생 성사에 필요) ──────────────────────────────────────────────
stratum_id: "UNKNOWN_STRATUM" # 소속 영토 UUID (STRATUM 생성 후 채울 것)
queen_id: "UNKNOWN_QUEEN"     # 함께 생성된 QUEEN UUID (탄생 성사 후 채울 것)

# ─── 제국 코어망 접속 정보 ──────────────────────────────────────────────────────
core:
  host: "127.0.0.1"
  port: 8800                  # EDENVALE 기본 포트. MONEWMENT-0 사용 시 8800

# ─── 로컬 Ollama 설정 (폐쇄망 AI) ─────────────────────────────────────────────
ollama:
  host: "127.0.0.1"
  port: 11434
  model: "gemma3:4b"          # 사용 가능한 모델로 변경 가능
  timeout_sec: 90             # 로컬 LLM 특성상 넉넉하게 설정

# ─── 파이프라인 설정 ────────────────────────────────────────────────────────────
pipeline:
  poll_interval_sec: 30       # 미처리 자산 폴링 주기 (초)
  batch_size: 5               # 1회 최대 처리 자산 수
  max_retries: 3              # Ollama 실패 시 최대 재시도 횟수
