apiVersion: apps/v1
kind: Deployment
metadata:
  name: vnc-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vnc-server
  template:
    metadata:
      labels:
        app: vnc-server
    spec:
      containers:
      - name: vnc-server
        image: dorowu/ubuntu-desktop-lxde-vnc
        env:
        - name: VNC_PASSWORD
          value: "secret"  # We won't use this if we use NoAuth, but setting it just in case.
        # This image uses 5900 for VNC.
        ports:
        - containerPort: 80
        - containerPort: 5900
---
apiVersion: v1
kind: Service
metadata:
  name: testvm-vnc
spec:
  selector:
    app: vnc-server
  ports:
  - protocol: TCP
    port: 5900
    targetPort: 5900
