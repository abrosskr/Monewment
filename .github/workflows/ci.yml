# .github/workflows/ci.yml
name: Monewment CI & Auto-Doc

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# [최적화 추가] GitHub Actions가 파일을 쓸 수 있도록 명시적으로 권한을 부여합니다.
permissions:
  contents: write

jobs:
  build-and-doc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests # AI 연동을 위해 필수
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🔍 Run Tests (준비 중)
      run: |
        echo "테스트 코드가 아직 없습니다. 스킵합니다."

    - name: 📝 Auto-Generate Documents
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/generate_docs.py

    - name: Commit Docs changes
      # 변경사항이 있을 때만 커밋을 진행합니다. (해선님 원본 유지)
      run: |
        git config --global user.name 'Monewment-Bot'
        git config --global user.email 'bot@monewment.ai'
        git add docs/STRUCTURE.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Auto-update project structure docs" && git push)