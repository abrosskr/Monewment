# .github/workflows/ci.yml
name: Monewment CI & Auto-Doc

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-doc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🔍 Run Tests (준비 중)
      run: |
        echo "테스트 코드가 아직 없습니다. 스킵합니다."
        # pytest (추후 활성화)

    - name: 📝 Auto-Generate Documents
      run: |
        python scripts/generate_docs.py

    - name: Commit Docs changes
      # 문서가 변경되었으면 자동으로 커밋해서 푸시함 (봇이 수행)
      run: |
        git config --global user.name 'Monewment-Bot'
        git config --global user.email 'bot@monewment.ai'
        git add docs/STRUCTURE.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Auto-update project structure docs" && git push)