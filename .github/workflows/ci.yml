# .github/workflows/ci.yml
name: Monewment CI & Auto-Doc

on:
  push:
    branches: [ "**" ]  # 모든 브랜치에서 트리거
  pull_request:
    branches: [ "main" ]

# [최적화 추가] GitHub Actions가 파일을 쓸 수 있도록 명시적으로 권한을 부여합니다.
permissions:
  contents: write

# [안정성 추가] 동시 실행 방지 (문서 충돌 방지)
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-doc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 전체 히스토리 가져오기
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests # AI 연동을 위해 필수
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🔍 Run Tests (준비 중)
      run: |
        echo "테스트 코드가 아직 없습니다. 스킵합니다."

    - name: 📝 Auto-Generate Documents
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/generate_docs_v4.py

    - name: Commit and Push Docs
      # 변경사항이 있을 때만 커밋을 진행합니다. [skip ci]로 무한 루프 방지
      run: |
        git config --global user.name 'Monewment-Bot'
        git config --global user.email 'bot@monewment.ai'
        git add docs/auto_generated/
        git add docs/deployment/
        git add docs/user_guide/
        git add docs/STRUCTURE.md
        
        # 변경사항 확인
        if ! git diff --quiet --staged; then
          git commit -m "📝 Auto-update documentation [skip ci]"
          
          # Pull with rebase before push (충돌 방지)
          git pull origin ${{ github.ref_name }} --rebase || true
          
          # Push with retry logic (안정성 향상)
          for i in 1 2 3; do
            echo "Push attempt $i/3..."
            if git push origin ${{ github.ref_name }}; then
              echo "✅ Successfully pushed!"
              exit 0
            fi
            echo "⚠️ Push failed, retrying..."
            git pull origin ${{ github.ref_name }} --rebase || true
            sleep 2
          done
          
          echo "❌ Push failed after 3 attempts"
          exit 1
        else
          echo "No documentation changes to commit"
        fi
