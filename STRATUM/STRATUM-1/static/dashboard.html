<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREUM | Sovereign Learning Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 20, 0.7);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text: #e0e0e0;
            --text-dim: #888;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00ffaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Background Animation --- */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
                              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.2;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-kf 1.5s infinite;
        }

        /* --- Stats Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover::after { opacity: 0.1; }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
        }

        /* --- Main Content --- */
        .main-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
        }

        .feed-list {
            list-style: none;
        }

        .feed-item {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .feed-item:hover { background: rgba(255, 255, 255, 0.05); }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .item-url { font-size: 14px; color: #fff; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-meta { font-size: 11px; color: var(--text-dim); }

        .confidence-pill {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .stratum-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stratum-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        /* --- Animations --- */
        @keyframes pulse-kf {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 var(--success); }
            70% { transform: scale(1.2); opacity: 0.5; box-shadow: 0 0 0 10px transparent; }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 transparent; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Loader --- */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent);
            z-index: 1000;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .loading #loader { transform: scaleX(1); animation: loading-kf 2s infinite; }

        @keyframes loading-kf {
            0% { transform: translateX(-100%) scaleX(0.5); }
            50% { transform: translateX(0) scaleX(1); }
            100% { transform: translateX(100%) scaleX(0.5); }
        }

    </style>
</head>
<body>
    <div id="loader"></div>
    <div class="grid-bg"></div>

    <div class="container">
        <header>
            <div class="logo">MONEWMENT // AREUM</div>
            <div class="status-badge">
                <div class="pulse"></div>
                SYSTEM OPERATIONAL
            </div>
        </header>

        <main>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Raw Assets</div>
                    <div class="stat-value" id="val-total-assets">---</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Extractions</div>
                    <div class="stat-value" id="val-total-extractions">---</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Processed Today (24h)</div>
                    <div class="stat-value" id="val-today-extractions" style="color: var(--accent);">---</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">REX Intelligence Feed</div>
                    <div class="stat-value" id="val-total-reports">---</div>
                </div>
            </div>

            <div class="main-section">
                <!-- Recent Extractions -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">LIVE EXTRACTION FEED</div>
                    </div>
                    <ul class="feed-list" id="feed-list">
                        <!-- Items injected here -->
                    </ul>
                </div>

                <!-- Active Stratums -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">ACTIVE STRATUMS</div>
                    </div>
                    <div class="stratum-list" id="stratum-list">
                        <!-- Stratums injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/v1/dashboard';

        async function updateStats() {
            document.body.classList.add('loading');
            try {
                const res = await fetch(`${API_BASE}/areum/stats`);
                const data = await res.json();
                
                document.getElementById('val-total-assets').textContent = data.total_assets.toLocaleString();
                document.getElementById('val-total-extractions').textContent = data.total_extractions.toLocaleString();
                document.getElementById('val-today-extractions').textContent = data.today_extractions.toLocaleString();
                document.getElementById('val-total-reports').textContent = data.total_reports.toLocaleString();
            } catch (e) {
                console.error("Stats fail", e);
            } finally {
                document.body.classList.remove('loading');
            }
        }

        async function updateRecent() {
            try {
                const res = await fetch(`${API_BASE}/areum/recent`);
                const data = await res.json();
                
                const list = document.getElementById('feed-list');
                list.innerHTML = data.samples.map(s => `
                    <li class="feed-item">
                        <div class="item-info">
                            <span class="item-url">${s.url}</span>
                            <span class="item-meta">${s.node_id} | ${new Date(s.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <div class="confidence-pill">${(s.confidence * 100).toFixed(1)}%</div>
                    </li>
                `).join('');
            } catch (e) {
                console.error("Recent fail", e);
            }
        }

        async function updateStratums() {
            try {
                const res = await fetch(`${API_BASE}/active_stratums`);
                const data = await res.json();
                const list = document.getElementById('stratum-list');
                list.innerHTML = data.stratums.map(s => `
                    <div class="stratum-item">
                        <span>${s.name}</span>
                        <span style="color: var(--success); font-size: 11px; font-weight: 600;">${s.status}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Stratum fail", e);
            }
        }

        function init() {
            updateStats();
            updateRecent();
            updateStratums();
            
            // Auto refreshes
            setInterval(updateStats, 5000);
            setInterval(updateRecent, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
